name: claude-verifier

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          docs_only=false
          files=$(git diff --no-renames --name-only "$BASE...HEAD")
          non_docs=$(printf '%s\n' "$files" | grep -Ev '^(LICENSE|[^/.][^/]*\.md|(docs|intent)/([^/.][^/]*/)*[^/.][^/]*\.md)$' || true)
          modes=$(git diff --no-renames --raw "$BASE...HEAD")
          unsafe_modes=$(printf '%s\n' "$modes" | grep -E '^:(100755|120000) |^:[0-9]{6} (100755|120000) ' || true)
          if [ -n "$files" ] && [ -z "$non_docs" ] && [ -z "$unsafe_modes" ]; then docs_only=true; fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  review:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY not set, skipping Claude verifier"
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: env.ANTHROPIC_API_KEY != ''
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the CI spec-verifier for PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read docs/SPEC.md, the ADRs in intent/decisions/, and the intent file(s) this PR adds or changes under intent/.
            The intent file's `task` field names the task card in SPEC §5. Review the diff against that task card and the spec.
            Report in the verdict format from SPEC §3 (VERDICT, TASK, FINDINGS with severity, EVIDENCE) as one PR comment.
            Do not push commits. Do not approve or merge.
          claude_args: --max-turns 30

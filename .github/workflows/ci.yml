name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EYES_PROVIDERS: fake

jobs:
  # Pull requests diff against the base branch. Pushes to main, the nightly run, and manual runs run everything.
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      changed: ${{ steps.scope.outputs.changed }}
      coverage_mode: ${{ steps.scope.outputs.coverage_mode }}
      coverage_include: ${{ steps.scope.outputs.coverage_include }}
      e2e_worker: ${{ steps.scope.outputs.e2e_worker }}
      e2e_golden: ${{ steps.scope.outputs.e2e_golden }}
      web: ${{ steps.scope.outputs.web }}
      reason: ${{ steps.scope.outputs.reason }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # ci-scope.ts imports only node: builtins, so Node alone is enough (no pnpm install).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: origin/${{ github.base_ref }}
        run: |
          docs_only=false
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/ci-scope.ts "$BASE"
            # Only root notes and Markdown under docs/ or intent/ are documentation.
            # App Markdown can be executable (for example, Astro pages).
            # --no-renames also checks the old path and mode of moved source files.
            files=$(git diff --no-renames --name-only "$BASE...HEAD")
            non_docs=$(printf '%s\n' "$files" | grep -Ev '^(LICENSE|[^/.][^/]*\.md|(docs|intent)/([^/.][^/]*/)*[^/.][^/]*\.md)$' || true)
            modes=$(git diff --no-renames --raw "$BASE...HEAD")
            unsafe_modes=$(printf '%s\n' "$modes" | grep -E '^:(100755|120000) |^:[0-9]{6} (100755|120000) ' || true)
            if [ -n "$files" ] && [ -z "$non_docs" ] && [ -z "$unsafe_modes" ]; then docs_only=true; fi
          else
            node scripts/ci-scope.ts --full
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  lint:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  mobile-typecheck:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  unit:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: unit tests (everything)
        if: needs.scope.outputs.full == 'true'
        run: pnpm test
      - name: unit tests (affected by this PR)
        if: needs.scope.outputs.full != 'true'
        run: pnpm exec vitest run --project unit --passWithNoTests --changed origin/${{ github.base_ref }}

  contract:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: contract tests (everything)
        if: needs.scope.outputs.full == 'true'
        run: pnpm test:contract
      - name: contract tests (affected by this PR)
        if: needs.scope.outputs.full != 'true'
        run: pnpm exec vitest run --project contract --passWithNoTests --changed origin/${{ github.base_ref }}

  integration:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: eyes
          POSTGRES_DB: eyes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:eyes@127.0.0.1:5432/eyes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate
      - name: integration tests (everything)
        if: needs.scope.outputs.full == 'true'
        run: pnpm test:integration
      - name: integration tests (affected by this PR)
        if: needs.scope.outputs.full != 'true'
        run: pnpm exec vitest run --project integration --passWithNoTests --changed origin/${{ github.base_ref }}
      - name: ax evals
        run: pnpm ax:eval

  coverage:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && (needs.scope.outputs.full == 'true' || needs.scope.outputs.coverage_mode == 'changed')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: eyes
          POSTGRES_DB: eyes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:eyes@127.0.0.1:5432/eyes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate
      - name: coverage gate (everything)
        if: needs.scope.outputs.full == 'true'
        run: pnpm coverage:all
      - name: coverage gate (changed source files only)
        if: needs.scope.outputs.full != 'true'
        env:
          INCLUDE: ${{ needs.scope.outputs.coverage_include }}
          BASE: origin/${{ github.base_ref }}
        run: |
          args=()
          IFS=',' read -r -a files <<< "$INCLUDE"
          for file in "${files[@]}"; do args+=("--coverage.include=$file"); done
          COVERAGE_GATE=1 pnpm exec vitest run --coverage --project unit --project contract --project safety --project integration --changed "$BASE" "${args[@]}"

  e2e:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && (needs.scope.outputs.full == 'true' || needs.scope.outputs.e2e_worker == 'true' || needs.scope.outputs.e2e_golden == 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: eyes
          POSTGRES_DB: eyes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:eyes@127.0.0.1:5432/eyes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - name: e2e (everything)
        if: needs.scope.outputs.full == 'true'
        run: pnpm test:e2e
      - name: e2e web suites
        if: needs.scope.outputs.full != 'true' && needs.scope.outputs.e2e_worker == 'true'
        run: pnpm exec playwright test --project worker --project dashboard --project landing
      - name: e2e golden-path suite
        if: needs.scope.outputs.full != 'true' && needs.scope.outputs.e2e_golden == 'true'
        run: pnpm exec playwright test --project golden

  safety-rules:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: safety rules (everything)
        if: needs.scope.outputs.full == 'true'
        run: pnpm test:safety
      - name: safety rules (affected by this PR)
        if: needs.scope.outputs.full != 'true'
        run: pnpm exec vitest run --project safety --passWithNoTests --changed origin/${{ github.base_ref }}

  intent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node scripts/check-intent.ts
        env:
          INTENT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && (needs.scope.outputs.full == 'true' || needs.scope.outputs.web == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm audit --prod

  sentrux:
    runs-on: ubuntu-latest
    env:
      SENTRUX_SKIP_GRAMMAR_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install Sentrux 0.5.7
        run: |
          curl -fsSL https://github.com/sentrux/sentrux/releases/download/v0.5.7/sentrux-linux-x86_64 -o "$RUNNER_TEMP/sentrux"
          echo "3237f80fe20d54aad4deefa8a143f0d60543bb5d2d6ad891eb42432f155725a6  $RUNNER_TEMP/sentrux" | sha256sum -c -
          curl -fsSL https://github.com/sentrux/sentrux/releases/download/v0.5.7/grammars-linux-x86_64.tar.gz -o "$RUNNER_TEMP/grammars.tar.gz"
          echo "8849f1eb07df3f6d4ea1ed422d8dee4b9b79a250682fa5646675dae466554454  $RUNNER_TEMP/grammars.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.sentrux/plugins"
          tar -xzf "$RUNNER_TEMP/grammars.tar.gz" -C "$HOME/.sentrux/plugins"
          chmod +x "$RUNNER_TEMP/sentrux"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: node scripts/check-quality.ts

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint 1.7.11
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: actionlint

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build .

  docs-automerge:
    # Auto-merge docs-only PRs once secrets-scan and intent pass. Same-repo, non-draft PRs only: forks and drafts cannot merge.
    needs: [scope, secrets-scan, intent]
    if: success() && needs.scope.outputs.docs_only == 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          current=$(gh pr view "$PR_URL" --json headRefOid,isDraft,state --jq '[.headRefOid, .isDraft, .state] | @tsv')
          if [ "$current" != "$(printf '%s\tfalse\tOPEN' "$TESTED_HEAD")" ]; then
            echo "PR head or eligibility changed since this run; refusing auto-merge"
            exit 1
          fi
          gh pr merge "$PR_URL" --auto --merge --match-head-commit "$TESTED_HEAD"

  docs-automerge-disable:
    # A code PR must not stay armed for auto-merge from an earlier docs-only push.
    needs: [scope]
    if: github.event_name == 'pull_request' && needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Disable auto-merge if this PR is not docs-only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr merge "$PR_URL" --disable-auto; then exit 0; fi
          # A failed lookup must fail the job, not masquerade as an unarmed PR.
          armed=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$armed" = "false" ]; then
            echo "auto-merge was not enabled; nothing to disable"
            exit 0
          fi
          exit 1
